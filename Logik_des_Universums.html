agieren. Durch Achtsamkeit können wir unser Leiden erkennen und loslassen, indem wir es mit einem Lächeln annehmen.\u003c/p>"},{"h":"\u003cp>Er gibt uns auch einige einfache Übungen, um das Loslassen zu üben, wie zum Beispiel das bewusste Atmen, das Gehen und das Lächeln. Er sagt, dass wir beim Einatmen sagen können: „Ich bin angekommen\", und beim Ausatmen: ‚Ich bin zu Hause‘. Das bedeutet, dass wir uns in unserem Körper und in unserer Umgebung wohlfühlen und nichts anderes brauchen. Er sagt auch, dass wir beim Gehen so gehen sollen, als würden wir die Erde mit unseren Füßen küssen². Das bedeutet, dass wir dankbar für das Leben sind und uns mit allem verbunden fühlen. Er sagt auch, dass wir immer ein Halblächeln auf unserem Gesicht halten sollen³. Das bedeutet, dass wir unsere Freude und Ruhe ausdrücken und unsere Anspannungen lösen.\u003c/p>\u003cp>Für Tich Nath Hanh ist Loslassen also eine Kunst, die wir lernen und üben können, um glücklicher und freier zu sein. Er sagt: \"Loslassen gibt uns Freiheit, und Freiheit ist die einzige Bedingung für Glück. Wenn wir uns in unserem Herzen immer noch an etwas klammern – an Ärger, Angstzustände oder Besitz – können wir nicht frei sein.\"\u003c/p>\u003cp>Er würde vielleicht noch sagen, dass Loslassen nicht bedeutet, sich von allem zu trennen, was uns wichtig ist, sondern vielmehr, die Dinge so zu sehen, wie sie wirklich sind: vergänglich, bedingt und nicht selbstständig. Er würde uns ermutigen, die Vergangenheit und die Zukunft loszulassen und im gegenwärtigen Moment zu leben, wo wir Frieden und Freude finden können. Er würde uns auch lehren, wie wir unsere Anhaftungen an unsere Vorstellungen, Meinungen und Konzepte loslassen können, die oft die Ursache für unser Leiden sind. Er würde uns sagen, dass wir offen und bereit sein müssen, neue Perspektiven zu lernen und zu verstehen.\u003c/p>\u003cp>Er würde auch uns sagen, dass wir uns nicht mit anderen vergleichen oder von ihnen abhängig machen sollen, sondern unsere eigene Schönheit und Einzigartigkeit erkennen sollen\u003c/p>"},{"h":"\u003ch2>\u003ca id=\"_eeokgvy3kbun\">\u003c/a>Kapitel 5 - Meditation\u003c/h2>\u003ch3>\u003ca id=\"_3hk3fwts3k0v\">\u003c/a>Meditation\u003c/h3>\u003cp>Ruhe, schwere, Wärme.\u003c/p>\u003cp>Es atmet in mir.\u003c/p>\u003cp>Ich atme ein, ich atme aus.\u003c/p>\u003cp>Meine Nase ist frei.\u003c/p>\u003cp>Meine Nasennebenhöhle ist frei.\u003c/p>\u003cp>Meine Augen sind entspannend.\u003c/p>\u003cp>Meine Stirnhöhlen sind frei.\u003c/p>\u003cp>Meine Stirn ist kühl.\u003c/p>\u003cp>Meine Schläfen sind entspannt.\u003c/p>\u003cp>Meine Wangen sind entspannt.\u003c/p>\u003cp>Meine Lippen sind entspannt.\u003c/p>\u003cp>Meine Zunge ist entspannt.\u003c/p>\u003cp>Mein Nasenraum ist frei.\u003c/p>\u003cp>Mein Rachen ist frei.\u003c/p>\u003cp>Mein Hals ist entspannt.\u003c/p>\u003cp>Meine Schilddrüse ist in Ordnung. \u003c/p>\u003cp>Meine Luftröhre ist frei. \u003c/p>\u003cp>Lunge. Zwerchfell. Magen. Dünndarm. \u003c/p>\u003cp>Dickdarm. Becken. Oberschenkel. \u003c/p>\u003cp>Knie. Schienbein. Fuß. Zehen.\u003c/p>\u003cp>Ruhe, Schwere, Wärme, es atmet in mir. Meine Nase ist frei. Meine Stirn ist kühl.\u003c/p>\u003cp>Schädel. Nacken. Schulter. Arme. Hände.\u003c/p>\u003cp>Handfläche „Chakra“.\u003c/p>\u003cp>Wirbelsäule. \u003c/p>\u003cp>Jeder einzelne Wirbel von Kopf bis zum Steißbein.\u003c/p>\u003ch3>\u003ca id=\"_3lvpmb1iu3x6\">\u003c/a>Achtsamkeit des Atmens\u003c/h3>\u003cp>In dem Anapanasati Sutta beschreibt der Buddha die Praxis der Achtsamkeit. Der zweite Teil behandelt die 4 x\u003c/p>\u003cp>4 = 16 Methoden des bewussten Atmens\u003c/p>\u003cp>1. die Achtsamkeit auf den Atem und den Körper\u003c/p>\u003cp>2. die Achtsamkeit auf die Gefühle/Empfindungen\u003c/p>\u003cp>3. die Achtsamkeit auf den Geist (dessen Zustand)\u003c/p>\u003cp>4. die Achtsamkeit auf die Geistesobjekte (alles, was wahrgenommen wird).\u003c/p>\u003cp>Sutra des bewussten Atmens (Anapanasati Sutta, Hrsg. Thich Nhat Hanh)\u003c/p>\u003ch5>\u003ca id=\"_ilr7c3mboy3f\">\u003c/a>Achtsamkeit des Atems (1–4)\u003c/h5>\u003cp>1) Ich atme ein und weiß, dass ich einatme.\u003c/p>\u003cp>Ich atme aus und weiß, dass ich ausatme.\u003c/p>\u003cp>2) Ich atme ein und bin mir der Länge der Einatmung bewusst.\u003c/p>\u003cp>Ich atme aus und bin mir der Länge der Ausatmung bewusst.\u003c/p>\u003ch5>\u003ca id=\"_l55kejb7sbbz\">\u003c/a>Achtsamkeit des Körpers\u003c/h5>\u003cp>3) Ich atme ein und nehme meinen ganzen Körper bewusst wahr.\u003c/p>\u003cp>Ich atme aus und nehme meinen ganzen Körper bewusst wahr.\u003c/p>\u003cp>4) Ich atme ein und entspanne und beruhige meinen ganzen Körper.\u003c/p>\u003cp>Ich atme aus und entspanne und beruhige meinen ganzen Körper.\u003c/p>\u003ch5>\u003ca id=\"_m0ps1jeffs8c\">\u003c/a>Achtsamkeit der Empfindungen (angenehme, unangenehme, neutrale)\u003c/h5>\u003cp>5) Ich atme ein und empfinde Freude.\u003c/p>\u003cp>Ich atme aus und empfinde Freude.\u003c/p>\u003cp>6) Ich atme ein und empfinde Glück.\u003c/p>\u003cp>Ich atme aus und empfinde Glück.\u003c/p>\u003cp>7) Ich atme ein und nehme die Aktivitäten meines Geistes bewusst wahr.\u003c/p>\u003cp>Ich atme aus und nehme die Aktivitäten meines Geistes bewusst wahr.\u003c/p>\u003cp>8) Ich atme ein und entspanne und beruhige die Aktivitäten meines Geistes.\u003c/p>\u003ch5>\u003ca id=\"_qihxo1e796bq\">\u003c/a>Achtsamkeit der Kontrolle und Befreiung des Geistes\u003c/h5>"},{"h":"\u003cp>9) Ich atme ein und nehme meinen Geist bewusst wahr.\u003c/p>\u003cp>Ich atme aus und nehme meinen Geist bewusst wahr.\u003c/p>\u003cp>10) Ich atme ein und mache meinen Geist glücklich und friedvoll.\u003c/p>\u003cp>Ich atme aus und mache meinen Geist glücklich und friedvoll.\u003c/p>\u003cp>11) Ich atme ein und konzentriere meinen Geist.\u003c/p>\u003cp>Ich atme aus und konzentriere meinen Geist.\u003c/p>\u003cp>12) Ich atme ein und befreie meinen Geist.\u003c/p>\u003cp>Ich atme aus und befreie meinen Geist.\u003c/p>\u003ch5>\u003ca id=\"_ijlrwy5yocvr\">\u003c/a>Achtsamkeit, um Licht auf die wahre Natur aller Dinge zu werfen\u003c/h5>\u003cp>13) Ich atme ein und beobachte die vergängliche Natur aller Dinge.\u003c/p>\u003cp>Ich atme aus und beobachte die vergängliche Natur aller Dinge.\u003c/p>\u003cp>14) Ich atme ein und beobachte das Verblassen aller Dinge.\u003c/p>\u003cp>Ich atme aus und beobachte das Verblassen aller Dinge.\u003c/p>\u003cp>15) Ich atme ein und beobachte die Befreiung. (Freude der Emanzipation)\u003c/p>\u003cp>Ich atme aus und beobachte die Befreiung.\u003c/p>\u003cp>16) Ich atme ein und beobachte das Loslassen.\u003c/p>\u003cp>Ich atme aus und beobachte das Loslassen.\u003c/p>\u003cp>\u003cem>Zur Vertiefung empfohlen:\u003c/em>\u003c/p>\u003cp>\u003cem>Thich Nhat Hanh\u003c/em>\u003c/p>\u003cp>\u003cem>Das Wunder des bewussten Atmens, Bielefeld: Theseus Verlag 2000\u003c/em>\u003c/p>\u003cp>\u003cem>Ven. Bhante Vimalaramsi\u003c/em>\u003c/p>\u003cp>\u003cem>Das Anapanasati-Sutta – Ein praktischer Wegweiser zur Achtsamkeit auf die Atmung und ruhiger Weisheit-Meditation (Übersetzung: Ronald Brudler)\u003c/em>\u003c/p>\u003ch3>\u003ca id=\"_syuyrrpco59u\">\u003c/a>Meditationsarten\u003c/h3>\u003cp>Es gibt verschiedene Meditationsarten. \u003c/p>\u003cp>Die wohl wichtigste Meditation ist die Meditation der 16 Atemübungen des Buddhas, doch es gibt noch viele andere Arten.\u003c/p>\u003cp>Hier möchte ich alle Arten, die ich kenne, aufzählen.\u003c/p>\u003col>\u003cli>16 Arten Übungen des Buddhas\u003c/li>\u003cli>Die vier Grundübungen des Autogentrainings\u003c/li>\u003cli>Die weiterführenden Übungen des autogenen Trainings.\u003c/li>\u003cli>Die sieben Punkte Meditation\u003c/li>\u003cli>Die 28 Chakrenmeditation.\u003c/li>\u003cli>Das Buddyscanning\u003c/li>\u003cli>Die Reiki-Meditation.\u003c/li>\u003cli>Mantra Meditation.\u003c/li>\u003cli>Afformationen und Affirmationen.\u003c/li>\u003cli>Die doppelte Afformation.\u003c/li>\u003cli>Geführte Meditationen mit Musik\u003c/li>\u003cli>Geführte Meditationen ohne Musik\u003c/li>\u003cli>AUDIOCAMENT.\u003c/li>\u003cli>Shambala und Nirwana MEDITATION.\u003c/li>\u003cli>Autohypnose. 10 9 8 7 ... 0\u003c/li>\u003cli>Das Klarträumen (Tagträumen).\u003c/li>\u003cli>Rückzugsort Meditation.\u003c/li>\u003cli>Aura Meditation.\u003c/li>\u003cli>Astralreisen.\u003c/li>\u003cli>Multiple Astralreisen. \u003c/li>\u003cli>Zähl Meditation.\u003c/li>\u003cli>Achtsamkeitsmeditation.\u003c/li>\u003cli>Gaya Meditation.\u003c/li>\u003cli>Intersein Meditation.\u003c/li>\u003cli>Metta Meditation. \u003c/li>\u003cli>Körpermeditation\u003c/li>\u003c/ol>\u003ch4>\u003ca id=\"_467s8ncjnukr\">\u003c/a>\tMetta Meditation. \u003c/h4>\u003ch4>\u003ca id=\"_vhlj4yiry1zm\">\u003c/a>DIE KRAFT DES SELBSTMITGEFÜHLS\u003c/h4>"},{"h":"\u003cp>Wir können nicht glücklich und gesund sein, wenn wir gegen uns selbst kämpfen. Doch oft sind wir zu anderen freundlicher als zu uns selbst. Die Praxis der Metta-Meditation kann uns dabei helfen, mehr Selbstmitgefühl zu entwickeln.\u003c/p>\u003cul>\u003cli>Möge ich glücklich sein.\u003c/li>\u003cli>Möge ich mich sicher und geborgen fühlen.\u003c/li>\u003cli>Möge ich gesund sein.\u003c/li>\u003cli>Möge ich unbeschwert leben.\u003c/li>\u003c/ul>\u003ch4>\u003ca id=\"_gn2p3eobgm4n\">\u003c/a>Körpermeditation\u003c/h4>\u003cp>Bei der Körpermeditation richtest du deine Aufmerksamkeit auf verschiedene Bereiche deines Körpers, wie zum Beispiel deine Füße, deine Beine, deinen Bauch, deine Brust, deine Arme, deine Hände, deinen Nacken, dein Gesicht und deinen Kopf. Du atmest tief und spürst, wie dein Atem durch deinen Körper fließt. Du nimmst wahr, wie sich dein Körper anfühlt, ob er warm oder kalt, angespannt oder entspannt, schwer oder leicht ist. Du akzeptierst deinen Körper so, wie er ist, ohne ihn zu bewerten oder zu verändern. Du dankst deinem Körper für alles, was er für dich tut.\u003c/p>\u003cp>Eine Körpermeditation kann dir helfen, dich mit deinem Körper zu verbinden, ihn besser kennenzulernen und ihm mehr Wertschätzung zu schenken. Außerdem kann sie dir helfen, Verspannungen zu lösen, Schmerzen zu lindern und deine Gesundheit zu fördern.\u003c/p>\u003ch3>\u003ca id=\"_4v3oqgoe3a0f\">\u003c/a>ZEN-Meditation, \u003cem>Kurzversion\u003c/em>\u003c/h3>\u003ch3>\u003ca id=\"_l55tu1xwbhr1\">\u003c/a>Körper\u003c/h3>\u003cul>\u003cli>Entspannung, Wohlbefinden, Heilung. \u003c/li>\u003c/ul>\u003cp>\u003cstrong>\u003cem>Einatmend bin ich mir in Achtsamkeit, meines Einatmens bewusst.\u003c/em>\u003c/strong>\u003c/p>\u003cp>\u003cstrong>\u003cem>Ausatmend bin ich mir in Achtsamkeit, meines Körpers bewusst.\u003c/em>\u003c/strong>\u003c/p>\u003cp>\u003cstrong>\u003cem>EIN – Achtsamkeit. \u003c/em>\u003c/strong>\u003c/p>\u003cp>\u003cstrong>\u003cem>AUS – Körpers.\u003c/em>\u003c/strong>\u003c/p>\u003ch3>\u003ca id=\"_knqc1h1jxj7o\">\u003c/a>Gefühle\u003c/h3>\u003cul>\u003cli>Wohltuend, Abklingen des Leidens, (Wahre) Liebe.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>\u003cem>Einatmend bin ich mir meinen wohltuenden Gefühlen bewusst. \u003c/em>\u003c/strong>\u003c/p>\u003cp>\u003cstrong>\u003cem>Ausatmend bin ich mir meinen liebenden Gefühlen bewusst.\u003c/em>\u003c/strong>\u003c/p>\u003cp>\u003cstrong>\u003cem>EIN – Wohlbefinden. \u003c/em>\u003c/strong>\u003c/p>\u003cp>\u003cstrong>\u003cem>AUS – Liebe.\u003c/em>\u003c/strong>\u003c/p>\u003ch3>\u003ca id=\"_wiptbzl96tef\">\u003c/a>Geist\u003c/h3>\u003cul>\u003cli>Sinne (Gefühle), Gedanken, Innerer-Dialog, Ego (Nama), Loslassen, Freiheit, innerer Friede.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>\u003cem>Einatmend bin ich mir meiner konzentrierten Gedanken bewusst.\u003c/em>\u003c/strong>\u003c/p>\u003cp>\u003cstrong>\u003cem>Ausatmend lasse ich meine Gedanken los.\u003c/em>\u003c/strong>\u003c/p>\u003cp>\u003cstrong>\u003cem>EIN – Konzentration. \u003c/em>\u003c/strong>\u003c/p>\u003cp>\u003cstrong>\u003cem>AUS – Freiheit.\u003c/em>\u003c/strong>\u003c/p>\u003ch3>\u003ca id=\"_txba0g6ucbsa\">\u003c/a>Objekte\u003c/h3>\u003cul>\u003cli>Vergänglichkeit, Karma (Kausalität), Verbundenheit, Intersein, Loslassen, Lehre (Ego). So-Sein, Nirwana.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>\u003cem>Einatmend bin ich mir des Intersein aller Dinge bewusst.\u003c/em>\u003c/strong>\u003c/p>"},{"h":"\u003cp>\u003cstrong>\u003cem>Ausatmend bin ich mir des So-Seins bewusst.\u003c/em>\u003c/strong>\u003c/p>\u003cp>\u003cstrong>\u003cem>EIN – Intersein. \u003c/em>\u003c/strong>\u003c/p>\u003cp>\u003cstrong>\u003cem>AUS – So-Sein.\u003c/em>\u003c/strong>\u003c/p>\u003ch3>\u003ca id=\"_cmkliwfaquta\">\u003c/a>Intersein im Stil von Thich Nhat Hanh.\u003c/h3>\u003cp>Atme ein und spüre, wie du mit allem verbunden bist, was dich umgibt. Atme aus und lächle dem Leben zu, das in dir und um dich herum fließt. Du bist nicht getrennt von der Welt, sondern ein Teil von ihr. Du bist nicht nur ein Körper, sondern auch ein Geist, ein Herz, eine Seele. Du bist nicht nur ein Mensch, sondern auch ein Tier, eine Pflanze, ein Stern. Du bist nicht nur hier, sondern auch dort, überall und nirgendwo.\u003c/p>\u003cp>Atme ein und erkenne, wie du von allem abhängig bist, was dich nährt und unterstützt. Atme aus und danke dem Universum für all die Gaben, die du empfängst. Du bist nicht unabhängig von der Welt, sondern auf sie angewiesen. Du brauchst nicht nur Luft, Wasser und Nahrung, sondern auch Liebe, Freundschaft und Weisheit. Du lebst nicht nur von dir selbst, sondern auch von anderen, von deiner Familie, deinen Freunden, deinen Lehrern. Du existierst nicht nur für dich selbst, sondern auch für andere, für deine Gemeinschaft, deine Gesellschaft, deine Menschheit.\u003c/p>\u003cp>Atme ein und fühle, wie du alles beeinflusst, was du berührst und beeinflusst. Atme aus und handle mit Achtsamkeit und Mitgefühl für alles, was du tust und sagst. Du bist nicht unwirksam in der Welt, sondern wirkungsvoll. Du hast nicht nur Rechte, sondern auch Pflichten. Du trägst nicht nur Verantwortung für dich selbst, sondern auch für andere. Du schaffst nicht nur dein eigenes Schicksal, sondern auch das Schicksal aller Wesen.\u003c/p>\u003cp>Atme ein und erfreue dich an der Schönheit und Vielfalt des Lebens. Atme aus und teile deine Freude und dein Leid mit allen Wesen. Du bist nicht allein in der Welt, sondern mit allen verbunden. Du fühlst nicht nur deine eigenen Gefühle, sondern auch die Gefühle anderer. Du leidest nicht nur unter deinen eigenen Problemen, sondern auch unter den Problemen anderer. Du genießt nicht nur deine eigenen Erfolge, sondern auch die Erfolge anderer.\u003c/p>\u003cp>Atme ein und erweitere dein Bewusstsein über dich selbst hinaus. Atme aus und lasse los von deinem Ego und deinen Anhaftungen. Du bist nicht identisch mit der Welt, sondern transzendierst sie. Du bist nicht begrenzt durch deine Form, sondern frei von ihr. Du bist nicht gebunden an deine Zeit, sondern jenseits von ihr. Du bist nicht gefangen in deinem Raum, sondern überall von ihm.\u003c/p>\u003cp>Atme ein und sei dir bewusst, dass du Intersein bist. Atme aus und sei dir bewusst, dass du Intersein bist.\u003c/p>"},{"h":"\u003cp>Intersein ist ein zentrales Konzept in der Lehre des vietnamesischen Zen-Meisters Thich Nhat Hanh. Es bezieht sich auf die Vorstellung, dass alles miteinander verbunden ist und dass wir alle Teil eines größeren Ganzen sind. In dieser Meditation werden wir uns auf das Intersein konzentrieren und uns daran erinnern, dass wir alle miteinander verbunden sind.\u003c/p>\u003cp>Beginnen Sie damit, sich in einer bequemen Position hinzusetzen. Schließen Sie Ihre Augen und atmen Sie tief ein und aus. Konzentrieren Sie sich auf Ihren Atem und spüren Sie, wie er durch Ihren Körper fließt.\u003c/p>\u003cp>Stellen Sie sich nun vor, dass Sie Teil eines großen Netzwerks sind. Dieses Netzwerk verbindet alles miteinander - die Menschen, Tiere, Pflanzen und sogar die Erde selbst. Spüren Sie die Verbindung zwischen Ihnen und allem anderen in diesem Netzwerk.\u003c/p>\u003cp>Atmen Sie tief ein und aus und spüren Sie, wie Ihre Verbindung zu allem um Sie herum stärker wird. Spüren Sie die Liebe und das Mitgefühl, die durch dieses Netzwerk fließen.\u003c/p>\u003cp>Nun stellen Sie sich vor, dass Sie eine Blume sind. Diese Blume ist Teil des Netzwerks des Lebens und ist mit allem um sie herum verbunden. Spüren Sie die Schönheit und das Leben in dieser Blume.\u003c/p>\u003cp>Atmen Sie tief ein und aus und spüren Sie, wie Ihre Verbindung zur Blume stärker wird. Spüren Sie die Liebe und das Mitgefühl, die durch diese Verbindung fließen.\u003c/p>\u003cp>Nun stellen Sie sich vor, dass Sie ein Baum sind. Dieser Baum ist Teil des Netzwerks des Lebens und ist mit allem um ihn herum verbunden. Spüren Sie die Kraft und Stärke dieses Baumes.\u003c/p>\u003cp>Atmen Sie tief ein und aus und spüren Sie, wie Ihre Verbindung zum Baum stärker wird. Spüren Sie die Liebe und das Mitgefühl, die durch diese Verbindung fließen.\u003c/p>\u003cp>Nun stellen Sie sich vor, dass Sie ein Berg sind. Dieser Berg ist Teil des Netzwerks des Lebens und ist mit allem um ihn herum verbunden. Spüren Sie die Ruhe und Stabilität dieses Berges.\u003c/p>\u003cp>Atmen Sie tief ein und aus und spüren Sie, wie Ihre Verbindung zum Berg stärker wird. Spüren Sie die Liebe und das Mitgefühl, die durch diese Verbindung fließen.\u003c/p>\u003cp>Nun stellen Sie sich vor, dass Sie das Universum sind. Das Universum ist Teil des Netzwerks des Lebens und ist mit allem um es herum verbunden. Spüren Sie die Weite und Unendlichkeit des Universums.\u003c/p>\u003cp>Atmen Sie tief ein und aus und spüren Sie, wie Ihre Verbindung zum Universum stärker wird. Spüren Sie die Liebe und das Mitgefühl, die durch diese Verbindung fließen.\u003c/p>"},{"h":"\u003cp>\u003cimg src=\"images/bild_20.jpg\">\u003c/p>","img":true},{"h":"\u003ch3>\u003ca id=\"_ritettsn1lwz\">\u003c/a>**Meditation über Intersein:**  2\u003c/h3>\u003cp>Setze dich in eine bequeme Position, schließe sanft deine Augen und lenke deine Aufmerksamkeit auf deinen Atem. Atme bewusst ein und aus, spüre den Fluss deines Atems, wie er kommt und geht, wie er in Harmonie mit dem Universum pulsiert.\u003c/p>\u003cp>Lass uns gemeinsam über das Wunder des Interseins nachdenken. Erinnere dich daran, dass alles in der Welt miteinander verbunden ist. Die Blumen, die Bäume, die Vögel und auch wir - wir sind alle Teile eines unendlichen Netzwerks des Lebens.\u003c/p>\u003cp>Stell dir vor, du bist wie ein Blatt an einem riesigen Baum. Du bist einzigartig, aber du teilst das gleiche Leben, die gleiche Essenz mit jedem anderen Blatt. Du bist getragen von derselben Lebenskraft, die den Baum nährt.\u003c/p>\u003cp>Richte deine Aufmerksamkeit auf deine Handflächen. Spüre die Energie, die in ihnen pulsiert. Diese Energie verbindet dich nicht nur mit dir selbst, sondern auch mit allem, was existiert. Du bist nicht getrennt von der Welt um dich herum. Du bist ein Teil von ihr, ein lebendiger Ausdruck des Interseins.\u003c/p>\u003cp>Wenn du an Menschen denkst, die du liebst, erkenne an, dass ihre Existenz auch mit deiner verflochten ist. Ihr seid nicht voneinander getrennt, sondern Teil derselben strahlenden Realität. Fühle die Liebe und Dankbarkeit, die aus dieser Erkenntnis erwächst.\u003c/p>\u003cp>Öffne nun dein Herz für diejenigen, die du vielleicht nicht so gut kennst oder die dir Schwierigkeiten bereiten. Erinnere dich daran, dass auch sie ein Teil dieses unendlichen Gewebes des Lebens sind. In ihrem Schmerz und ihren Freuden finden sich Parallelen zu deinem eigenen Leben.\u003c/p>\u003cp>Nun lassen wir unsere Gedanken wie Wolken vorbeiziehen. Wir erkennen an, dass unsere Sorgen und Ängste Teil eines größeren Ganzen sind. Sie sind wie vorüberziehende Wolken am Himmel des Interseins.\u003c/p>\u003cp>Mit jedem Atemzug lassen wir uns tiefer in diese Erkenntnis sinken. Wir lassen los, erlauben uns, in den Fluss des Lebens einzutauchen, ohne Widerstand. In diesem Augenblick sind wir in vollkommener Harmonie mit allem, was ist.\u003c/p>\u003cp>Wenn du bereit bist, öffne sanft deine Augen. Nimm dir einen Moment, um dich in diesem Gefühl des Interseins zu baden, bevor du wieder in die Welt hinausgehst.\u003c/p>\u003cp>Möge diese Meditation dich daran erinnern, dass du nie allein bist. Du bist ein untrennbarer Teil des großen Gewebes des Lebens. In dieser Erkenntnis finden wir Frieden und Harmonie.\u003c/p>"},{"h":"\u003ch2>\u003ca id=\"_b7hwizz6jlax\">\u003c/a>Kapitel 6 - ZEN Philosophie\u003c/h2>"},{"h":"\u003cp>\u003cimg src=\"images/bild_21.jpg\">\u003c/p>","img":true},{"h":"\u003ch3>\u003ca id=\"_bdazamkyx7hg\">\u003c/a>Die 5 Sprachen der Liebe\u003c/h3>\u003ch4>\u003ca id=\"_5akt9fe75jcx\">\u003c/a>Lob und Anerkennung\u003c/h4>\u003cp>Wer diese Sprache beherrscht, dem fällt es leicht, Menschen mit Komplimenten zu überhäufen, sie zu loben oder ihnen einfach nur zu sagen: Ich bin stolz auf dich! Dafür bedarf es meist keines besonderen Anlasses, vielmehr tut es Anerkennungs-Anhängern einfach gut, ihr Gegenüber wissen zu lassen, was für ein wunderbarer und besonderer Mensch es ist. Im Gegenzug ist ihnen die eigene Wertschätzung ebenso wichtig, und sie fühlen sich schnell zurückgesetzt, wenn Tage verstreichen, ohne dass dem Partner ein lobendes Wort über die Lippen kommt.\u003c/p>\u003ch4>\u003ca id=\"_div6hv5yb8c6\">\u003c/a>Zweisamkeit\u003c/h4>\u003cp>Zeit mit dem Liebsten zu verbringen, steht für diese Menschen an höchster Stelle. Dabei geht es nicht darum, eine actionreiche Unternehmung nach der anderen zu erleben, sondern um Momente, die man ganz bewusst und intensiv miteinander erlebt – ein schönes Abendessen, ein gutes Gespräch, ein ungestörtes Wochenende. Menschen, die diese Liebessprache vorrangig sprechen, schenken dem anderen uneingeschränkte Aufmerksamkeit, erwarten dies aber auch von ihrem Partner.\u003c/p>\u003ch4>\u003ca id=\"_sn8p6xjdxx87\">\u003c/a>Geschenke\u003c/h4>\u003cp>Die Geschenke-Sprache spricht, wer Freude daran hat, den anderen zu überraschen, sich für ihn verrückte oder ausgefallene Geschenke auszudenken. Also wer die Fähigkeit besitzt, zu bemerken, was sich der Partner wünscht, nur um dessen leuchtende Augen zu sehen. Allerdings neigen diese Menschen schnell dazu, enttäuscht zu sein, wenn der Partner beispielsweise nach einer langen Reise das erhoffte Mitbringsel vergisst.\u003c/p>\u003ch4>\u003ca id=\"_ob6ubqh1qj0s\">\u003c/a>Hilfsbereitschaft\u003c/h4>\u003cp>Nicht lang quatschen, einfach machen – so lautet das Motto dieser Love Language. Wer sie spricht, erkennt sofort, wo Hilfe benötigt wird, bringt unaufgefordert den Müll raus, macht gerne den Abwasch, unterstützt bei der Steuererklärung oder baut Regale auf. Der anderen Arbeit abzunehmen oder ihn zu unterstützen ist eine wunderbare Art, Liebe zu zeigen. Erkennt der Partner das nicht an oder übersieht er gar die ihm entgegengebrachte Hilfsbereitschaft, fühlen sich Menschen mit dieser Love Language nicht wertgeschätzt und reagieren schnell mit emotionalem Rückzug.\u003c/p>\u003ch4>\u003ca id=\"_mviqxiezt70g\">\u003c/a> Zärtlichkeit\u003c/h4>"},{"h":"\u003cp>Für Menschen, die die Love Language Zärtlichkeit sprechen, sind Streicheleinheiten, lange Umarmungen oder leidenschaftliche Küsse das A und O in der Liebe. Für eine glückliche Beziehung brauchen sie regelmäßig intensiven körperlichen Kontakt. Dabei ist weniger wichtig, ständig gesagt zu bekommen, wie sexy und begehrenswert man ist – eine heiße Liebesnacht ist vielmehr Beweis genug. Aber auch einfach nur spontanes Händchen halten in der Öffentlichkeit tut jenen Menschen, die den Fokus auf Zärtlichkeit haben, gut. Generell gilt: Taten zählen hier mehr als Worte!\u003c/p>\u003ch3>\u003ca id=\"_csv89l3hz3w2\">\u003c/a>Vier Edle Wahrheiten\u003c/h3>\u003cp>1. \u003cem>Dukkha\u003c/em>: Glück ist vergänglich, und das Leben ist Leiden.\u003c/p>\u003cp>2. \u003cem>Samudaya\u003c/em>: Die Ursachen für das Leiden sind Gier, Hass und Verblendung. Das Leiden entsteht also, weil die Menschen immer mehr haben wollen als sie besitzen und nicht zufrieden sind mit dem, was sie haben.\u003c/p>\u003cp>3. \u003cem>Nirodha\u003c/em>: Das Leiden hört auf, wenn die Menschen diese Ursachen überwinden.\u003c/p>\u003cp>4. \u003cem>Magga\u003c/em>: Es gibt einen Weg zum Glück. Das ist der achtfache Pfad.\u003c/p>\u003ch4>\u003ca id=\"_bvq46eaazpgy\">\u003c/a>Der achtfache Pfad.\u003c/h4>"},{"h":"\u003ch2>\u003ca id=\"_92mvsaqfhbxo\">\u003c/a>\u003cimg src=\"images/bild_22.jpg\">\u003c/h2>","img":true},{"h":"\u003ch3>\u003ca id=\"_bmnt4a3ihd10\">\u003c/a>Der edle achtfache Pfad\u003c/h3>\u003cp>Der edle achtfache Pfad ist das zentrale Element der Lehre des Buddhas und wird dargelegt u. a. in einer Lehrrede der mittleren Sammlung Majjhima Nikaya M.117.\u003c/p>\u003cp>Er beschreibt einen Weg aus dem Leiden (Dukkha), aus der Unzulänglichkeit aller Existenz, heraus zur Freiheit vom Leid, zum Erwachen aus der Ich-Illusion.\u003c/p>\u003cp>Es ist dabei kein linearer Weg, sondern die einzelnen Bestandteile fördern und bedingen sich gegenseitig. Daher wird der Pfad traditionell als Rad mit acht Speichen dargestellt, um die Untrennbarkeit aller acht Bereiche zu symbolisieren.\u003c/p>\u003cp>Der edle achtfache Pfad gliedert sich in die Bereiche Weisheit (Pañña, 1./2.), Tugend (Sila, 3./4./5.) und Sammlung (Samādhi, 6./7./8.). Seine Bestandteile lauten im Einzelnen:\u003c/p>\u003ch4>\u003ca id=\"_y3w37992nmue\">\u003c/a>1. Rechte Ansicht:\u003c/h4>\u003cp>Dies bedeutet, die vier edlen Wahrheiten zu erkennen: das Leidhafte und nicht Zufriedenstellende in jeglichen Phänomenen, ihre Bedingtheit und Abhängigkeit. Zudem Begehren als Ursache davon zu erkennen und die Auflösung des Begehrens als Auflösung allen Leids. Der Weg zur Auflösung ist der edle achtfache Pfad.\u003c/p>\u003ch4>\u003ca id=\"_wv245odkzkzj\">\u003c/a>2. Rechte Gesinnung:\u003c/h4>\u003cp>Ist eine von Entsagung, Nicht-Übelwollen und Nicht-Grausamkeit sich selbst und allen Wesen gegenüber durchdrungene Haltung, die allem Denken, Sprechen und Handeln zugrunde liegt? Die Entfaltung heilsamer Herzensqualitäten wie liebende Güte, Mitgefühl, Mitfreude und Gleichmut fördern die rechte Gesinnung.\u003c/p>\u003ch4>\u003ca id=\"_z0cd3o5637ie\">\u003c/a>3. Rechte Rede:\u003c/h4>\u003cp>Bedeutet, die Wahrheit zu sprechen, auf eine klare, freundliche, wesentliche und nicht hinterfragende Weise, mit einem Herzen frei von unheilsamen Geisteszuständen wie Begehren oder Ablehnung.\u003c/p>\u003ch4>\u003ca id=\"_gryf53vb3bek\">\u003c/a>4. Rechtes Handeln:\u003c/h4>\u003cp>Ein Einhalten der fünf Tugendregeln: Jegliches Leben schützen und bewahren, sich nichts aneignen, was nicht gegeben wird, Großzügigkeit und Freigebigkeit leben, in sexuellen Beziehungen Verantwortung übernehmen und niemandem schaden, sowie die Vermeidung berauschender, den Geist trübender Substanzen.\u003c/p>\u003ch4>\u003ca id=\"_xsypxwdzvkl4\">\u003c/a>5. Rechter Lebenserwerb:\u003c/h4>\u003cp>Den eigenen Lebenserwerb unter den Prämissen der rechten Rede und des rechten Handelns stellen, also Vermeidung von Berufen oder Tätigkeiten, durch welche man sich selbst oder anderen Wesen Schaden zufügt.\u003c/p>\u003ch4>\u003ca id=\"_6k2khivoxxma\">\u003c/a>6. Rechte Anstrengung:\u003c/h4>\u003cp>Unheilsame Gedanken und Geisteszustände vermeiden bzw. überwinden und im Gegensatz dazu heilsame Gedanken und Geisteszustände entfalten und fördern \u003c/p>\u003ch4>\u003ca id=\"_aeat1isikekc\">\u003c/a>7. Rechte Achtsamkeit:\u003c/h4>"},{"h":"\u003cp>Bedeutet, die Achtsamkeit und Wissensklarheit  beständig gegenwärtig zu halten, und zwar in den vier Bereichen Körper, Gefühle, Herz und Geistesobjekte. \u003c/p>\u003ch4>\u003ca id=\"_9mxoqze200ma\">\u003c/a>8. Rechte Sammlung (Meditation)\u003c/h4>\u003cp>Die Bedingtheit des eigenen diskursiven Geistes erkennen und ihn wandeln in einen gesammelten, Erkenntnis fähigen Geist, dem sowohl das Erlangen tiefer Sammlung Zustände möglich ist, als auch die Einsicht in die Daseinsmerkmale Vergänglichkeit, Leidhaftigkeit, Substanzlosigkeit.\u003c/p>\u003ch3>\u003ca id=\"_flq7ukrwumed\">\u003c/a>Erwachen aus der Ich-Illusion\u003c/h3>\u003cp>Thich Nhat Hanh sagte, dass die Illusion des Seins, also die Vorstellung, dass wir getrennte und unabhängige Wesen sind, die Quelle von Leiden und Konflikten ist¹. Er lehrte, dass wir durch die Praxis des Interseins, also der Einsicht, dass alles mit allem verbunden ist, diese Illusion überwinden und Frieden und Harmonie in uns und um uns herum schaffen können². Er sagte: „Wir sind hier, um die Illusion des Getrenntseins zu überwinden, und um zu erkennen, dass wir alle miteinander verbunden sind.“\u003c/p>\u003cp>René Descartes berühmter Grundsatz: „Ich denke, also bin ich“ hat unser Weltbild bis in die heutige Zeit geprägt.\u003c/p>\u003cp>Thích Nhất Hạnh hat in seinen Dharma-Vorträgen diese Aussage oft umgedreht: \u003cstrong>\u003cem>„Ich denke, also bin ich nicht.“\u003c/em>\u003c/strong>\u003c/p>\u003cp>Denn solange wir gefangen sind in unseren Gedankenwelten, Angst-Projektionen und Fantasien, können wir die Realität im Hier und Jetzt nicht wahrnehmen.\u003c/p>\u003cp>\u003cstrong>Angst\u003c/strong>\u003c/p>\u003cp>„Wenn wir Angst haben, sollten wir uns nicht von ihr überwältigen lassen. Wir sollten sie liebevoll umarmen wie ein kleines Kind. Wir sollten ihr sagen: ‘Ich bin hier für dich. Ich werde dich nicht allein lassen. Ich weiß, dass du da bist, und ich werde dich mit meiner Achtsamkeit umsorgen.’“\u003c/p>\u003ch3>\u003ca id=\"_nfw3g65hwh8x\">\u003c/a>Nirwana\u003c/h3>\u003cp>Nirwana ist ein buddhistischer Schlüsselbegriff, der den Austritt aus dem Samsara, dem Kreislauf des Leidens, des Daseins und der Wiedergeburten durch Erwachen bezeichnet. Das Wort bedeutet „Erlöschen“ im Sinne des Endes aller mit falschen persönlichen Vorstellungen vom Dasein verbundenen Faktoren wie Ich-Sucht, Gier, Anhaften. ¹\u003c/p>\u003cp>Der Zen Buddhismus versteht Nirwana nicht als einen Zustand, der erst nach dem Tod erreicht wird, sondern als einen Geisteszustand, der schon im Leben möglich ist. Nirwana ist das „höchste Glück“, das unabhängig und jenseits aller Gefühle, Bedingungen und Gestaltungen ist. Nirwana ist gleichbedeutend mit innerer Ruhe und Freisein von aller Unruhe des Geistes. ¹\u003c/p>"},{"h":"\u003cp>Um Nirwana zu erreichen, muss man alle Anhaftungen an die Bedingungen des Samsara loslassen. Dies geschieht durch intensive Betrachtung eines der drei Merkmale des Daseins: Unbeständigkeit, Leidhaftigkeit, Leerheit. Durch die kontinuierliche neutrale Beobachtung aller Daseinsphänomene führt man zu einer allmählichen Loslösung und gipfelt in der Erfahrung des Maggaphala, dem „Moment der Frucht“. \u003c/p>\u003ch3>\u003ca id=\"_xfb4u24a37h6\">\u003c/a>Motivation \u003c/h3>\u003cp>Motivation ist das, was erklärt, warum Menschen oder Tiere ein bestimmtes Verhalten zu einem gewissen Zeitpunkt beginnen, fortsetzen oder beenden. Sie umfasst die Gesamtheit aller Motive oder Beweggründe, die zur Handlungsbereitschaft führen, und das auf emotionaler und neuronaler Aktivität zurückzuführende Streben des Menschen nach Zielen oder wünschenswerten Zielobjekten. Motivationszustände werden allgemein als Kräfte verstanden, die im Handelnden wirken und eine Disposition zu zielgerichtetem Verhalten erzeugen. Es wird oft angenommen, dass verschiedene mentale Zustände miteinander konkurrieren und dass nur der stärkste Zustand das Verhalten bestimmt. Das bedeutet, dass man motiviert sein kann, etwas zu tun, ohne es tatsächlich zu tun. Der paradigmatische Geisteszustand, der Motivation bewirkt, ist die Begierde. Aber auch verschiedene andere Zustände, wie Glaubenshaltungen darüber, was man tun sollte, oder Absichten, können motivieren. Die Umsetzung von Motiven in Handlungen nennt man Volition.\u003c/p>\u003ch4>\u003ca id=\"_785w7bhel2nd\">\u003c/a>Volition\u003c/h4>\u003cp>Volition bezeichnet die bewusste, willentliche Umsetzung von Zielen und Motiven in Resultate (Ergebnisse) durch zielgerichtete Steuerung von Gedanken, Emotionen, Motiven und Handlungen. Dieser Prozess der Selbststeuerung erfordert die Überwindung von inneren und äußeren Widerständen, wie zum Beispiel Unlustgefühle oder Ablenkungen durch Willenskraft.\u003c/p>\u003cp>Volition ist die Fähigkeit, Wunschvorstellungen (Absichten, Motive oder Ziele) in gezielte Handlungen umzusetzen, die zu Resultaten (Erfolgen) führen. Man bezeichnet die Volition auch als Umsetzungskompetenz oder Willenskraft (englisch Willpower).\u003c/p>\u003ch4>\u003ca id=\"_vir84lueo6y6\">\u003c/a>\u003c/h4>"},{"h":"\u003ch2>\u003ca id=\"_cqdehapnp3l9\">\u003c/a>Kapitel 7 - Bewusstsein und Intersein.\u003c/h2>\u003ch3>\u003ca id=\"_3l6diyqvki7l\">\u003c/a>Wir sind Bewusstsein.\u003c/h3>\u003cp>\u003cstrong>\u003cem>Wir sind Bewusstsein und Intersein. Liebe, Achtsamkeit.\u003c/em>\u003c/strong>\u003c/p>"},{"h":"\u003cp>\u003cstrong>\u003cem>\u003cimg src=\"images/bild_23.jpg\">\u003c/em>\u003c/strong>\u003c/p>","img":true},{"h":"\u003cp>\u003cstrong>\u003cem>Bild Kreis mit den WORTEN : Bewusstsein , Intersein. Liebe, Konzentration, Achtsamkeit.\u003c/em>\u003c/strong>\u003c/p>\u003cp>\u003cstrong>\u003cem>“Unachtsamkeit ist Dunkelheit. Achtsamkeit ist Licht. Ich wecke das Bewusstsein, das auf alles Leben scheint.” - TNH\u003c/em>\u003c/strong>\u003c/p>\u003cp>Dies bezieht sich auf ein tiefes Verständnis der Verbundenheit aller Dinge und Wesen sowie auf die Praxis der Achtsamkeit, die uns hilft, diese Verbundenheit zu erkennen und zu leben.\u003c/p>\u003cp>Die Idee des Interseins stammt aus der buddhistischen Lehre und wurde von dem vietnamesischen Zen-Meister Thich Nhat Hanh popularisiert. Sie besagt, dass alles im Universum miteinander verbunden ist und dass das Glück und Leiden eines jeden Wesens mit dem Glück und Leiden aller anderen verbunden ist.\u003c/p>\u003cp>Achtsamkeit ist eine Praxis, die uns dabei unterstützt, im gegenwärtigen Moment präsent zu sein und ein tieferes Verständnis für das Leben und unsere Erfahrungen zu entwickeln. Sie lehrt uns, unsere Gedanken, Gefühle und Handlungen bewusst wahrzunehmen, ohne zu urteilen.\u003c/p>\u003cp>Die 14 Achtsamkeitsübungen, die von Thich Nhat Hanh formuliert wurden, sind praktische Anleitungen, um Achtsamkeit in unser tägliches Leben zu integrieren und das Bewusstsein für das Intersein zu stärken. Diese Übungen helfen uns, Einsicht und Mitgefühl zu kultivieren, was wiederum dazu beiträgt, Furcht und die Illusion eines getrennten Selbst zu überwinden.\u003c/p>\u003cp>Intersein ist keine Theorie, sondern eine direkt erfahrbare Realität, die uns zeigt, dass unser Wohlergehen untrennbar mit dem Wohlergehen anderer und der Welt verbunden ist. Durch die Praxis der Achtsamkeit können wir lernen, achtsamer mit uns selbst, anderen Menschen und unserer Umwelt umzugehen.\u003c/p>\u003ch3>\u003ca id=\"_7vhau04z284k\">\u003c/a>Bewusstsein im Zen-Buddhismus.\u003c/h3>\u003cp>Im Zen-Buddhismus wird das Bewusstsein als ein Zustand der offenen Weite, wach und klar, verstanden. Es ist eine reine, ungefilterte Wahrnehmung des gegenwärtigen Moments, die durch achtsames, nicht fixiertes Beobachten ohne Denken erreicht wird1. Es gibt verschiedene Arten des Bewusstseins im Buddhismus, darunter Sehen, Hören, Riechen, Schmecken, Fühlen und das Denk-Bewusstsein. Diese ersten sechs Formen können oft zu einer leidvollen Trennung von “Mir” und der Welt führen. Darüber hinaus gibt es das Ich-Bewusstsein und das Speicher-Bewusstsein, welches alle Formen und Erscheinungen der Welt beeinflusst. Diese acht Formen können das wahre Wesen verdecken: reines Bewusstsein, reinen Geist.\u003c/p>\u003cp>Zen legt Wert darauf, jeden Moment intensiv zu erleben und jede Handlung bewusst auszuführen, unterstützt durch Meditation und Atemübungen. Es ist ein Weg zur wahren Menschlichkeit, der Meditation, Ethik und die von Weisheit durchdrungene Erkenntnis der Wirklichkeit betont\u003c/p>"},{"h":"\u003cp>\u003cem>„Wenn die Achtsamkeit etwas Schönes berührt, offenbart sie dessen Schönheit. Wenn sie etwas Schmerzvolles berührt, wandelt sie es um und heilt es.“ - TNH.\u003c/em>\u003c/p>\u003ch3>\u003ca id=\"_obr2h1io3d94\">\u003c/a>“Dein” und “Mein”\u003c/h3>\u003cp>In der Philosophie wird oft über das Selbst und den Anderen nachgedacht. Das “Dein” und “Mein” kann als Metapher für die persönliche Identität und die Beziehung zu anderen verstanden werden. In der westlichen Philosophie sprach Descartes vom “Cogito, ergo sum” – “Ich denke, also bin ich”, was die Existenz des Selbst durch das Denken bestätigt. Im Gegensatz dazu betont die östliche Philosophie, wie im Buddhismus, die Idee des “Anatta” oder “Nicht-Selbst”, die besagt, dass die Vorstellung eines unabhängigen Selbst eine Illusion ist.\u003c/p>\u003cp>\u003cem>“Ich denke, also bin ich NICHT” - TNH\u003c/em>\u003c/p>\u003ch3>\u003ca id=\"_i820ry17vg2g\">\u003c/a>“Dein” und “Mein” eine Illusion\u003c/h3>\u003cp>Die buddhistische Lehre betont, dass das Festhalten an Besitz und Identität zu Leiden führt. Wenn wir uns von dieser Illusion lösen, können wir inneren Frieden finden.\u003c/p>\u003cp>“Dein” und “Mein” sind relative Konzepte, die von unserer individuellen Perspektive abhängen. Die Illusion liegt darin, dass wir uns oft mit diesen Konzepten identifizieren und vergessen, dass wir alle Teil eines größeren Ganzen sind – sei es auf physischer, mentaler oder spiritueller Ebene.“Dein” und “Mein” sind relative Konzepte, die von unserer individuellen Perspektive abhängen. Die Illusion liegt darin, dass wir uns oft mit diesen Konzepten identifizieren und vergessen, dass wir alle Teil eines größeren Ganzen sind – sei es auf physischer, mentaler oder spiritueller Ebene.\u003c/p>\u003cp>“Wir sind hier, um von unserer Illusion der Getrenntheit aufzuwachen.”- TNH\u003c/p>\u003ch3>\u003ca id=\"_iwliuehcfkwn\">\u003c/a>Dualität\u003c/h3>\u003cp>Das Konzept der Dualität ist ein faszinierendes und weitreichendes Thema in der Philosophie. Es bezieht sich auf die Idee, dass viele Aspekte der Realität oder der menschlichen Erfahrung in zwei gegensätzliche, aber miteinander verbundene Teile aufgeteilt werden können. Diese können physisch oder metaphysisch sein, wie Licht und Dunkelheit, Gut und Böse, Körper und Geist, Yin und Yang.\u003c/p>\u003cp>In der westlichen Philosophie wird oft über Dualität im Kontext von **Körper und Geist** gesprochen, ein Konzept, das tief in den Diskussionen von Philosophen wie René Descartes verwurzelt ist. Descartes argumentierte für eine klare Trennung zwischen dem physischen Körper, der dem Bereich der Naturwissenschaften angehört, und dem nicht-physischen Geist, der Sitz des Bewusstseins und der Identität ist.\u003c/p>"},{"h":"\u003cp>In der östlichen Philosophie, insbesondere im Taoismus, wird Dualität durch das Konzept von **Yin und Yang** dargestellt. Diese repräsentieren komplementäre Kräfte, die in der natürlichen Welt existieren und zusammenwirken, um Harmonie und Gleichgewicht zu schaffen.\u003c/p>\u003cp>In der Physik findet sich Dualität in der **Welle-Teilchen-Dualität**, die besagt, dass Elementarteilchen wie Elektronen sowohl Wellen- als auch Teilcheneigenschaften aufweisen können. Dieses Konzept ist ein zentraler Bestandteil der Quantenmechanik.\u003c/p>\u003cp>Dualität kann auch in der Ethik, der Literatur und der Kunst gefunden werden, wo sie oft verwendet wird, um Konflikte, Gegensätze und die Komplexität des menschlichen Lebens zu erforschen. In jedem Fall lädt das Konzept der Dualität dazu ein, über die Vielfalt und die Tiefe der Welt nachzudenken, in der wir leben.\u003c/p>\u003cp>\u003cstrong>\u003cem>\"Alles, was wir für uns selbst tun, tun wir auch für andere, und alles, was wir für andere tun, tun wir auch für uns selbst.\"- TNH\u003c/em>\u003c/strong>\u003c/p>"},{"h":"\u003cp>\u003cstrong>\u003cem>\u003cimg src=\"images/bild_24.jpg\">\u003c/em>\u003c/strong>\u003c/p>","img":true},{"h":"\u003cp>\u003cem>Stell dir vor, du bist ein einzelner Tropfen im Ozean. Du magst dich als getrennt von den anderen Tropfen fühlen, aber in Wahrheit bist du ein Teil des gesamten Ozeans. Dein “Dein” und “Mein” sind nur vorübergehende Illusionen, die durch die Begrenzungen deiner Wahrnehmung entstehen. In Wirklichkeit sind wir alle miteinander verbunden, wie die Wellen, die sich im Ozean bewegen.\u003c/em>\u003c/p>\u003ch3>\u003ca id=\"_uhnpsafmj3tn\">\u003c/a>“Ich liebe, also sind wir”\u003c/h3>\u003cp>René Descartes prägte mit seinem berühmten Satz „Ich denke, also bin ich“ das westliche Verständnis des Selbstbewusstseins. Sein Ansatz betonte die Rolle des rationalen Denkens als Grundlage der Existenz und definierte das „Ich“ als eine isolierte Entität, die sich selbst durch das Denken als existent beweist. Der Satz stellt das Individuum und seinen Intellekt in den Mittelpunkt der Wahrnehmung der Realität.\u003c/p>\u003cp>Doch die Zen-Philosophie, wie sie von Thich Nhat Hanh vertreten wird, bringt eine andere Perspektive mit sich. Mit der Aussage „Ich denke, also bin ich nicht“ zeigt Thich Nhat Hanh, dass die Identifikation mit dem Denken uns von der wahren Essenz unseres Seins entfernt. Er erinnert uns daran, dass das ständige Kreisen der Gedanken uns von der Gegenwart und vom Erleben trennt. In der Überidentifikation mit dem Denken verlieren wir die Verbindung zu dem, was wirklich ist.\u003c/p>\u003cp>Hier setzt die Idee \u003cstrong>„Ich liebe, also sind wir“\u003c/strong> an. Während Denken das Individuum von der Welt isoliert, bringt Liebe uns zusammen. Liebe ist eine Verbindung, die die Grenzen zwischen dem „Ich“ und dem „Du“ auflöst und ein „Wir“ entstehen lässt. Es ist in der Liebe, dass wir die tiefste Form des Seins erfahren, die nicht allein auf dem Verstand beruht, sondern auf der Verbundenheit, dem Mitgefühl und der gemeinsamen Erfahrung des Lebens.\u003c/p>\u003cp>Liebe ist nicht nur ein Gefühl; sie ist eine Kraft, die uns zeigt, dass wir nicht getrennt sind, sondern Teil eines Netzwerks von Beziehungen. „Ich liebe, also sind wir“ bedeutet, dass das Sein im Zusammensein, im Teilen und im gegenseitigen Unterstützen gefunden wird. Wenn wir lieben, erweitern wir unser Sein über uns selbst hinaus und erkennen die gegenseitige Abhängigkeit, das „Intersein“, von dem Thich Nhat Hanh spricht.\u003c/p>\u003cp>In der Liebe liegt die Erkenntnis, dass unsere Existenz nicht durch das isolierte „Ich“ definiert ist, sondern durch das Miteinander. Das „Wir“ wird zum Ausdruck einer existenziellen Wahrheit, in der das Bewusstsein nicht nur in sich selbst ruht, sondern in der Verbindung zu anderen und der Welt.\u003c/p>"},{"h":"\u003cp>Liebe ist die Brücke, die uns vom Denken zum Sein führt. Sie zeigt uns, dass wahre Freiheit und Existenz im tiefen Erleben von Beziehungen und im Mitgefühl liegen. Sie erinnert uns daran, dass das Leben nicht nur eine intellektuelle Ergründung ist, sondern ein geteiltes Abenteuer, bei dem das „Ich“ im „Wir“ seine tiefste Erfüllung findet.\u003c/p>\u003cp>\u003cstrong>\u003cem>„Ich liebe, also sind wir“\u003c/em>\u003c/strong>\u003c/p>"},{"h":"\u003cp>\u003cstrong>\u003cem>\u003cimg src=\"images/bild_25.jpg\">\u003c/em>\u003c/strong>\u003c/p>","img":true},{"h":"\u003ch2>\u003ca id=\"_kw3ou6npg63o\">\u003c/a>Kapitel 8- Der Weg zum Glück.\u003c/h2>\u003ch3>\u003ca id=\"_fth70nbf2ypy\">\u003c/a>Charakter und Talent.\u003c/h3>\u003cp>Der Charakter eines Menschen in der buddhistischen Psychologie wird als eine dynamische und veränderliche Gesamtheit von geistigen Faktoren beschrieben, die das Denken, Fühlen und Handeln einer Person bestimmen. Diese Faktoren werden als Skandhas (Daseinsgruppen) oder Dharmas (Phänomene) bezeichnet und umfassen Form, Empfindung, Wahrnehmung, Geistesregungen und Bewusstsein¹². Der Charakter eines Menschen ist also nicht etwas Festes oder Unveränderliches, sondern etwas, das sich ständig in Abhängigkeit von den Bedingungen entwickelt.\u003c/p>\u003cp>Die buddhistische Psychologie lehrt, dass der Charakter eines Menschen sowohl positive als auch negative Aspekte hat, die zu seinem Glück oder Leiden beitragen können¹². Die positiven Aspekte werden als heilsame oder geschickte Geistesfaktoren bezeichnet, die zu Weisheit, Mitgefühl und Befreiung führen können¹². Die negativen Aspekte werden als unheilsame oder ungeschickte Geistesfaktoren bezeichnet, die zu Unwissenheit, Anhaftung und Leid führen können. Die buddhistische Psychologie bietet Methoden an, wie man die heilsamen Geistesfaktoren kultivieren und die unheilsamen Geistesfaktoren überwinden kann, um den Charakter eines Menschen zu transformieren.\u003c/p>\u003cp>Das Talent eines Menschen in der buddhistischen Psychologie wird als eine besondere Fähigkeit oder Anlage beschrieben, die sich in einem bestimmten Bereich des Lebens manifestiert¹. Das Talent ist nicht etwas Angeborenes oder Unveränderliches, sondern etwas, das durch die Schulung des Geistes und die Praxis der Achtsamkeit entwickelt und verfeinert werden kann. Das Talent ist auch nicht etwas, das nur dem eigenen Nutzen oder Vergnügen dient, sondern etwas, das zum Wohle aller Lebewesen eingesetzt werden soll. Das Talent ist somit eine Ausdrucksform der Weisheit und des Mitgefühls, die zu den wichtigsten Zielen der buddhistischen Psychologie gehören. Die buddhistische Psychologie beschreibt das Unterbewusstsein als das **Speicherbewusstsein**, das alle Informationen und Erfahrungen aufnimmt, aufbewahrt und wieder hervorbringt¹. Das Speicherbewusstsein enthält auch die **Samen** oder **Potenziale** für alle mentalen Faktoren, die das Bewusstsein beeinflussen, wie z. B. Gefühle, Wahrnehmungen, Willen, Aufmerksamkeit, etc. Das Speicherbewusstsein ist die grundlegendste Form des Bewusstseins und kann ungefähr mit dem **Unbewussten** in der westlichen Psychologie verglichen werden².\u003c/p>\u003ch3>\u003ca id=\"_s25hr16ir9a\">\u003c/a>\u003cstrong>Gefühle\u003c/strong>\u003c/h3>"},{"h":"\u003cp>Gefühle kommen und gehen wie Wolken an einem windigen Himmel. Bewusstes Atmen ist mein Anker. Wenn wir keinen inneren Frieden haben, wenn wir uns nicht wohl in unserer Haut fühlen, können wir unsere Kinder nicht wirklich gut erziehen. Wenn wir gut für unsere Kinder sorgen wollen, müssen wir gut für uns selber sorgen.\u003c/p>\u003ch3>\u003ca id=\"_8lgorkk2pjfl\">\u003c/a>Selbstwert\u003c/h3>\u003cp>Thích Nhất Hạnh,  ein vietnamesischer Zen-Mönch und Friedensaktivist, hat viel über Selbstwert geschrieben und gelehrt. Seine Lehren basieren auf der buddhistischen Philosophie, die das Selbst als einen Prozess des ständigen Werdens und Vergehens sieht, ohne feste Identität.\u003c/p>\u003ch4>\u003ca id=\"_yqlhji6sr4wo\">\u003c/a>Einige zentrale Punkte seiner Lehre zum Selbstwert sind:\u003c/h4>\u003cp>\u003cstrong>Selbstliebe und Mitgefühl:\u003c/strong> Thích Nhất Hạnh betont die Bedeutung von Selbstliebe und Mitgefühl als Grundlage für einen gesunden Selbstwert. Er lehrt, dass wir uns selbst mit Freundlichkeit und Verständnis behandeln sollten, genauso wie wir es mit anderen tun würden.\u003c/p>\u003cp>\u003cstrong>Achtsamkeit: \u003c/strong>Achtsamkeitspraxis kann uns helfen, unsere Gedanken und Gefühle zu beobachten, ohne sie zu bewerten. Dadurch können wir unsere negativen Selbstbilder erkennen und loslassen.\u003c/p>\u003cp>\u003cstrong>Vergebung: \u003c/strong>Thích Nhất Hạnh lehrt, dass Vergebung uns von der Last der Vergangenheit befreit und uns hilft, mit uns selbst und anderen Frieden zu schließen.\u003c/p>\u003cp>\u003cstrong>Dankbarkeit:\u003c/strong> Dankbarkeit für die kleinen Dinge im Leben kann uns helfen, unsere Lebensumstände und uns selbst mehr zu schätzen.\u003c/p>\u003ch4>\u003ca id=\"_41bb3ge1l14w\">\u003c/a>Einige Zitate von Thích Nhất Hạnh zum Selbstwert:\u003c/h4>\u003cp>\"Mitgefühl für sich selbst ist der erste Schritt zur Liebe zu anderen.\"\u003c/p>\u003cp>\"Du bist nicht dein Schmerz. Du bist nicht deine Angst. Du bist nicht deine Wut. Du bist das Bewusstsein, das all diese Dinge beobachtet.\"\u003c/p>\u003cp>\"Vergebung ist die Befreiung von der Vergangenheit.\"\u003c/p>\u003cp>\"Dankbarkeit ist die Tür zum Glück.\"\u003c/p>\u003cul>\u003cli>Thích Nhất Hân's Lehren zum Selbstwert können uns helfen, ein gesünderes und erfüllteres Leben zu führen. Indem wir lernen, uns selbst mit Liebe und Mitgefühl zu begegnen, können wir unsere negativen Selbstbilder überwinden und unsere wahre innere Schönheit erkennen.\u003c/li>\u003c/ul>\u003ch3>\u003ca id=\"_4zgdfwp0t2h4\">\u003c/a>Selbstwertgefühl\u003c/h3>\u003cp>Im Zen-Buddhismus versteht man unter Selbstwertgefühl die Anerkennung der eigenen Buddha-Natur, die in jedem Lebewesen vorhanden ist.\u003c/p>\u003cp>\u003cstrong>1. Loslösung vom Ego:\u003c/strong>\u003c/p>\u003cp>Im Zen geht es darum, das Ego zu überwinden, welches als illusionäres Konstrukt betrachtet wird, das Leid verursacht. Anstatt sich mit dem Ego zu identifizieren, kultiviert man im Zen eine achtsame Beobachterposition, die Gedanken und Emotionen ohne Anhaftung wahrnimmt.\u003c/p>"},{"h":"\u003cp>\u003cstrong>2. Selbstliebe und Mitgefühl:\u003c/strong>\u003c/p>\u003cp>Statt Selbstwertgefühl im Sinne von \"besser sein als andere\" zu verstehen, fördert der Zen-Buddhismus Selbstliebe und Mitgefühl. Man erkennt die eigene Vergänglichkeit und die Verbundenheit mit allen Wesen. Mitgefühl für sich selbst und andere entsteht aus dieser Erkenntnis.\u003c/p>\u003cp>\u003cstrong>3. Ursprüngliche Natur:\u003c/strong>\u003c/p>\u003cp>Zen zielt darauf ab, die \"ursprüngliche Natur\" des Geistes zu erkennen, die frei von Konzepten und Bewertungen ist. In diesem Zustand des Gewahrseins ruht ein tiefes Vertrauen in die eigene innere Weisheit und Güte.\u003c/p>\u003cp>\u003cstrong>4. Praxis und Achtsamkeit:\u003c/strong>\u003c/p>\u003cp>Die Entwicklung eines gesunden Selbstwertgefühls im Zen geschieht durch kontinuierliche Praxis, z.B. Meditation, Achtsamkeit im Alltag und Studium der buddhistischen Lehren. Durch diese Praxis lernt man, sich selbst besser zu verstehen, mit schwierigen Emotionen umzugehen und im Hier und Jetzt zu leben.\u003c/p>\u003cp>\u003cstrong>5. Vergänglichkeit und Impermanenz:\u003c/strong>\u003c/p>\u003cp>Die buddhistische Lehre von der Vergänglichkeit aller Dinge spielt eine wichtige Rolle. Anstatt an einem statischen Selbstbild festzuhalten, lernt man im Zen, die Dynamik des Lebens zu akzeptieren und sich mit dem Fluss der Veränderung zu bewegen.\u003c/p>\u003cp>\u003cstrong>Zusammenfassend lässt sich sagen:\u003c/strong>\u003c/p>\u003cp>Im Zen-Buddhismus geht es nicht um ein statisches Selbstwertgefühl, sondern um die Entwicklung von Selbstliebe, Mitgefühl und Achtsamkeit.\u003c/p>\u003cp>Die Praxis des Zen zielt darauf ab, die eigene \"ursprüngliche Natur\" zu erkennen, die frei von Bewertungen und Konzepten ist.\u003c/p>\u003cp>Durch die Verankerung im Hier und Jetzt und die Akzeptanz der Vergänglichkeit entsteht ein tiefes Vertrauen in die eigene innere Weisheit und Güte.\u003c/p>\u003cul>\u003cli>Thích Nhất Hạnh hat auch viel über das Thema Selbstwertgefühl gesagt, das er als das Gefühl definiert hat, dass wir wertvoll und liebenswert sind, unabhängig von unseren äußeren Bedingungen.\u003c/li>\u003c/ul>\u003cp>Für Thích Nhất Hạnh ist Selbstwert eng verbunden mit der Praxis der Achtsamkeit, die uns hilft, uns selbst und die Welt um uns herum so zu sehen, wie sie wirklich sind. Durch Achtsamkeit erkennen wir, dass wir nicht von anderen Wesen und Phänomenen getrennt sind, sondern dass wir alle miteinander verbunden sind. Wir erkennen auch, dass wir alle das Potenzial haben, glücklich und frei zu sein, wenn wir unsere negativen Gewohnheiten, Gedanken und Emotionen loslassen und unsere positiven Qualitäten wie Liebe, Verständnis und Weisheit kultivieren³.\u003c/p>\u003cp>Thích Nhất Hạnh hat uns viele praktische Übungen gegeben, um unser Selbstwertgefühl zu stärken, wie z. B.:\u003c/p>"},{"h":"\u003cp>- **Sich selbst anlächeln**. Er hat uns ermutigt, jeden Morgen, wenn wir aufwachen, uns selbst im Spiegel anzulächeln und uns zu sagen: „Ich bin ein Wunder. Ich bin wertvoll. Ich bin liebenswert.“ Er hat gesagt, dass dies eine einfache, aber kraftvolle Art ist, uns selbst zu akzeptieren und zu schätzen.\u003c/p>\u003cp>- **Sich selbst umarmen**. Er hat uns gelehrt, wie wir uns selbst umarmen können, um uns selbst Mitgefühl und Trost zu schenken, besonders wenn wir leiden oder uns einsam fühlen. Er hat gesagt, dass wir uns selbst umarmen können, indem wir unsere Arme um unsere Brust legen, unseren Atem beobachten und uns sagen: „Ich bin hier für dich. Ich weiß, dass du leidest. Ich werde dich nicht allein lassen. Ich liebe dich.“ Er hat gesagt, dass dies eine Art ist, uns selbst zu heilen und zu beruhigen.\u003c/p>\u003cp>- **Sich selbst loben**. Er hat uns geraten, uns selbst zu loben, wenn wir etwas Gutes tun oder etwas Schwieriges überwinden. Er hat gesagt, dass wir uns selbst sagen können: „Ich bin stolz auf dich. Du hast das gut gemacht. Du bist mutig. Du bist stark. Du bist wunderbar.“ Er hat gesagt, dass dies eine Art ist, uns selbst zu ermutigen und zu motivieren.\u003c/p>\u003cp>Das sind nur einige Beispiele, wie Thích Nhất Hạnh uns gezeigt hat, wie wir unser Selbstwertgefühl stärken können. Er hat uns immer daran erinnert, dass wir alle Buddhas sind, dass wir alle das Licht der Erleuchtung in uns haben, und dass wir alle das Recht haben, glücklich und frei zu sein.\u003c/p>\u003ch3>\u003ca id=\"_4k8sorac0qoh\">\u003c/a>„Die vier (fünf) Versprechen.“ (Tolteken)\u003c/h3>\u003cp>1. Versprechen: Sei tadellos in deinen Worten!\u003c/p>\u003cp>2. Versprechen: Nimm nichts persönlich!\u003c/p>\u003cp>3. Versprechen: Triff keine Annahmen! (Vermutungen)\u003c/p>\u003cp>4. Versprechen: Gib stets dein Bestes!\u003c/p>\u003cp>\u003cem>5 Sei skeptisch, aber höre gut zu.\u003c/em>\u003c/p>"},{"h":"\u003cp>\u003cem>\u003cimg src=\"images/bild_26.jpg\">\u003c/em>\u003c/p>","img":true},{"h":"\u003cp>Die fünf Versprechen der Tolteken sind eine Reihe von Prinzipien, die auf der alten Weisheit der Tolteken basieren, einer mesoamerikanischen Kultur, die zwischen dem 10. und 12. Jahrhundert den größten Teil Zentralmexikos beherrschte. Die Versprechen sollen den Menschen helfen, sich selbst zu befreien und ein erfülltes Leben zu führen. Die fünf Versprechen sind:\u003c/p>\u003cp>- Sei untadelig mit deinem Wort. Sprich mit Integrität und sage nur das, was du wirklich meinst. Vermeide es, dich selbst oder andere zu verletzen oder zu verleumden.\u003c/p>\u003cp>- Nimm nichts persönlich. Was andere sagen oder tun, ist eine Projektion ihrer eigenen Realität, nicht deiner. Wenn du immun gegen die Meinungen und Handlungen anderer bist, wirst du kein unnötiges Leiden erfahren.\u003c/p>\u003cp>- Ziehe keine voreiligen Schlüsse. Finde den Mut, Fragen zu stellen und so klar wie möglich zu kommunizieren. Vermeide es, Annahmen zu machen, die zu Missverständnissen, Konflikten und Enttäuschungen führen können.\u003c/p>\u003cp>- Gib immer dein Bestes. Dein Bestes wird sich je nach den Umständen ändern, aber wenn du immer dein Bestes gibst, wirst du dich selbst respektieren und vermeiden, dich selbst zu beurteilen oder zu bereuen.\u003c/p>\u003cp>- Sei skeptisch, aber lerne, zuzuhören. Hinterfrage alles, was du hörst, aber sei offen für neue Informationen und Perspektiven. Lerne, die Botschaften hinter den Worten zu erkennen und die Wahrheit in dir zu finden.\u003c/p>\u003cp>Diese fünf Versprechen wurden von Miguel Ángel Ruiz, einem mexikanischen Arzt und Schriftsteller, in seinem Buch “Die vier Versprechen”: Ein Weisheitsbuch der Tolteken popularisiert. Später fügte er ein fünftes Versprechen hinzu, das er in seinem Buch “Der fünfte Berg”: Die Weisheit des Herzens erläuterte. Die Versprechen basieren auf der Soteriologie der Tolteken, dem Zweig der Theologie, der sich mit der Erlösung befasst.\u003c/p>\u003ch3>\u003ca id=\"_7obu3hgr20h7\">\u003c/a>Hoʻoponopono\u003c/h3>"},{"h":"\u003cul>\u003cli>\u003cstrong>Es tut mir leid, bitte verzeih mir.\u003c/strong>\u003c/li>\u003cli>\u003cstrong>“Ich liebe dich”\u003c/strong>\u003c/li>\u003cli>\u003cstrong>Danke.\u003c/strong>\u003c/li>\u003cli>Ho'oponopono ist ein traditionelles Verfahren der Hawaiianer zur Aussöhnung und Vergebung¹². Es ist ein Weg, um über die wechselseitige Vergebung, sich selbst und andere zu heilen¹. Das Wort Ho’oponopono bedeutet \"etwas tun\", \"etwas ausgleichen\", in \"Harmonie bringen\", und \"etwas korrigieren\" auf Hawaiianisch. Es wurde in vergangenen Zeiten von den Kahuna's oder Priestern angewandt¹. Ho’oponopono erlaubt es dem Menschen, alte seelische Wunden ebenso negative Gedanken, Gefühle und Verletzungen in Frieden zu bringen, auszusöhnen¹. Es führt zu Freiheit, Frieden, Freude, Einsicht von eigenen Fehlern, Verstehen und Erkennen der Fehler anderer, Mut und Kraft im Herzen zu entfachen, zu vergeben, Ungerechtigkeit zu überwinden, Vertrauen und Hingabe zu entwickeln, Gottesvertrauen und Liebe zu stärken, Ängste und Ungerechtigkeiten in liebevolle, verzeihende und gütige Verhaltensweisen zu verändern¹. \u003c/li>\u003c/ul>\u003cp>- Anhang:\u003c/p>\u003cp>\u003cem>Nagarjuna – Zen Philosoph\u003c/em>\u003c/p>\u003ch3>\u003ca id=\"_805drgwk3zy7\">\u003c/a>Die Lehre von den „Zwei Wahrheiten“ (satyadvaya)\u003c/h3>\u003cp>Bei der Verkündigung des Dharma haben sich die Buddhas auf die zwei Wahrheiten gestützt: Die eine ist die weltliche, ‚verhüllte Wahrheit‘ (saṃvṛtisatya), die andere ist die ‚Wahrheit im höchsten Sinne’ (paramārthasatya). Diejenigen, die den Unterschied der beiden Wahrheiten nicht erkennen, die erkennen auch nicht die tiefe Wahrheit (tattva) in der Lehre Buddhas.\u003c/p>\u003ch3>\u003ca id=\"_bzkcs1fp1mqr\">\u003c/a>Ohne Schlamm kein Lotos\u003c/h3>"},{"h":"\u003cp>\u003cimg src=\"images/bild_27.jpg\">\u003c/p>","img":true},{"h":"\u003cp>Die Kunst, Leid zu verwandeln, von Thich Nhat Hanh\u003c/p>\u003cp>„Wer vor dem Leid wegläuft, kann kein Glück finden.“\u003c/p>\u003cp>„Die meisten Menschen fürchten sich davor, zu leiden. Doch das Leiden ist eine Art Schlamm, der die Lotosblüte des Glücks zum Erblühen bringt. Es gäbe keine Lotosblüte ohne den Schlamm.”\u003c/p>\u003cp>Denn erst, wenn wir das eigene \u003cstrong>Leid \u003c/strong>verstehen und anerkennen, können wir \u003cstrong>Verständnis und Mitgefühl\u003c/strong> für uns und andere entwickeln. Diese beiden Seiten sind der Schlüssel zu einem erfüllten und zufriedenen Leben. Wenn wir lernen, unser Leid anzuerkennen, leiden wir bereits weniger. Wir hören auf, die unangenehmen Gefühle in uns durch übermäßigen Konsum zu kompensieren. Achtsamkeit hilft uns zu sehen, dass wir bereits mehr als genug Bedingungen haben, um glücklich zu sein.\u003c/p>\u003ch3>\u003ca id=\"_nmc4ocwwdynd\">\u003c/a>Die Hauptpfeiler der Gesundheit\u003c/h3>\u003cp>Die Hauptpfeiler der Gesundheit sind die Faktoren, die zu einem optimalen Wohlbefinden von Körper, Geist und Seele beitragen. Es gibt verschiedene Ansätze, um diese Pfeiler zu definieren, aber einige der häufigsten sind:\u003c/p>\u003cp>- Ernährung: Die Auswahl von nahrhaften, ausgewogenen und natürlichen Lebensmitteln, die den Körper mit Energie, Vitaminen, Mineralien und Antioxidantien versorgen.\u003c/p>\u003cp>- Bewegung: Die regelmäßige Ausübung von körperlicher Aktivität, die die Herz-Kreislauf-Gesundheit, die Muskelkraft, die Flexibilität, die Knochenmasse und die Immunabwehr verbessert.\u003c/p>\u003cp>- Regeneration: Die Gewährleistung einer ausreichenden Erholung, die den Körper und den Geist entspannt, den Schlaf fördert, den Stress abbaut und die Stimmung hebt. (Meditation)\u003c/p>\u003cp>- Mentale Kompetenz: Die Entwicklung von positiven, lösungsorientierten und sinnvollen Gedanken, die die Selbstwirksamkeit, die Resilienz, die Motivation und die Zufriedenheit erhöhen.\u003c/p>\u003cp>- Umfeldgestaltung: Die Schaffung einer angenehmen, sicheren und unterstützenden Umgebung, die die sozialen Beziehungen, die Anerkennung, die Werte und die Lebensqualität fördert.\u003c/p>\u003cp>Diese Pfeiler sind miteinander verbunden und beeinflussen einander. Eine gute Balance zwischen ihnen kann zu einer besseren Gesundheit und einem glücklicheren Leben führen. 😊\u003c/p>\u003cp>_______________________________________________________\u003c/p>\u003cp>\u003cstrong>Weitere Themen …\u003c/strong>\u003c/p>\u003cp>\u003cem>Theodizee\u003c/em>\u003c/p>\u003cp>\u003cem>Nirwana\u003c/em>\u003c/p>\u003cp>\u003cem>Schatten\u003c/em>\u003c/p>\u003cp>\u003cem>Universale (Kraft)  (Gott)\u003c/em>\u003c/p>\u003cp>\u003cem>So-Sein.\u003c/em>\u003c/p>\u003cp>\u003cem>Quantum Liebe\u003c/em>\u003c/p>\u003cp>\u003cem>Traum Therapie \u003c/em>\u003c/p>\u003cp>\u003cem>Trennen vom Objekt. \u003c/em>\u003c/p>\u003cp>\u003cem>Pfeiler der Gesundheit \u003c/em>\u003c/p>\u003cp>\u003ca href=\"http://www.dhammatalks.net/German/Vimalaramsi_Anapanasati_german_w_intro.pdf\">\u003cem>www.dhammatalks.net/German/Vimalaramsi_Anapanasati_german_w_intro.pdf\u003c/em>\u003c/a>\u003c/p>"},{"h":"\u003cp>Archetyp (Psychologie)\u003c/p>\u003cp>\u003cem>Berühre die Erde jedes Mal, wenn du Angst hast.\u003c/em>\u003c/p>\u003cp>\u003cem>Berühre sie tief,\u003c/em>\u003c/p>\u003cp>\u003cem>und dein Kummer wird dahinschmelzen.\u003c/em>\u003c/p>\u003cp>\u003cem>Berühre sie tief,\u003c/em>\u003c/p>\u003cp>\u003cem>und du wirst das Unsterbliche berühren.\u003c/em>\u003c/p>\u003cp>\u003cem>~Thich Nhat Hanh, Nenn mich bei meinen wahren Namen\u003c/em>\u003c/p>"},{"h":"\u003cp>\u003cem>\u003cimg src=\"images/bild_28.jpg\">\u003c/em>\u003c/p>","img":true},{"h":"\u003cp>\u003cstrong>\u003cem>Zen Stichwörter\u003c/em>\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cem>Presence spüren\u003c/em>\u003c/li>\u003cli>\u003cem>Intersein\u003c/em>\u003c/li>\u003cli>\u003cem>Gruppen intersein\u003c/em>\u003c/li>\u003cli>\u003cem>Ambivertiert\u003c/em>\u003c/li>\u003cli>\u003cem>Einzatz Energie … (Kalkuliertes kleines Risiko.)\u003c/em>\u003c/li>\u003cli>\u003cem>Wieder Gut machen … Ho'oponopono - 5 Tolteken\u003c/em>\u003c/li>\u003cli>\u003cem>Synchronizität\u003c/em>\u003c/li>\u003cli>\u003cem>Achtsamkeit\u003c/em>\u003c/li>\u003cli>\u003cem>Meditation\u003c/em>\u003c/li>\u003cli>\u003cem>Konzentration\u003c/em>\u003c/
